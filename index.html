<html lang="kk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>6-сынып информатика тесті</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: linear-gradient(135deg, #dff3ff, #eef1ff);
        min-height: 100vh;
        color: #222;
    }

    .container {
        width: 95%;
        max-width: 900px;
        margin: 30px auto;
    }

    .header {
        background: linear-gradient(135deg, #2563eb, #7c3aed);
        color: white;
        padding: 25px;
        border-radius: 20px;
        text-align: center;
        box-shadow: 0 8px 25px rgba(0,0,0,0.15);
    }

    .header h1 {
        margin: 0 0 10px;
        font-size: 30px;
    }

    .header p {
        margin: 5px;
        font-size: 17px;
    }

    .selection {
        background: white;
        margin-top: 20px;
        padding: 25px;
        border-radius: 18px;
        box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        text-align: center;
    }

    .selection h2 {
        color: #2563eb;
    }

    .variant-buttons {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 12px;
        margin-top: 20px;
    }

    .variant-btn {
        padding: 15px;
        border: none;
        border-radius: 12px;
        background: #2563eb;
        color: white;
        font-size: 17px;
        font-weight: bold;
        cursor: pointer;
        transition: 0.2s;
    }

    .variant-btn:hover {
        transform: translateY(-2px);
        background: #1d4ed8;
    }

    .random-btn {
        margin-top: 15px;
        background: #16a34a;
    }

    .test {
        display: none;
        margin-top: 20px;
    }

    .progress-box {
        background: white;
        padding: 15px 20px;
        border-radius: 15px;
        margin-bottom: 15px;
        box-shadow: 0 5px 15px rgba(0,0,0,0.08);
    }

    .progress-text {
        display: flex;
        justify-content: space-between;
        font-weight: bold;
        margin-bottom: 8px;
    }

    .progress {
        height: 12px;
        background: #e5e7eb;
        border-radius: 10px;
        overflow: hidden;
    }

    .progress-bar {
        height: 100%;
        width: 0%;
        background: linear-gradient(90deg, #2563eb, #7c3aed);
        transition: 0.3s;
    }

    .question-card {
        background: white;
        border-radius: 20px;
        padding: 30px;
        box-shadow: 0 7px 25px rgba(0,0,0,0.1);
    }

    .question-number {
        display: inline-block;
        background: #ede9fe;
        color: #6d28d9;
        padding: 8px 14px;
        border-radius: 20px;
        font-weight: bold;
        margin-bottom: 15px;
    }

    .question {
        font-size: 21px;
        font-weight: bold;
        line-height: 1.5;
        margin-bottom: 25px;
    }

    .answers {
        display: grid;
        gap: 13px;
    }

    .answer {
        border: 2px solid #dbeafe;
        background: #f8fbff;
        padding: 16px;
        border-radius: 12px;
        cursor: pointer;
        font-size: 17px;
        transition: 0.2s;
    }

    .answer:hover {
        background: #eff6ff;
        border-color: #60a5fa;
        transform: translateX(3px);
    }

    .answer.selected {
        border-color: #2563eb;
        background: #dbeafe;
    }

    .answer.correct {
        background: #dcfce7;
        border-color: #16a34a;
        color: #166534;
    }

    .answer.wrong {
        background: #fee2e2;
        border-color: #dc2626;
        color: #991b1b;
    }

    .answer.disabled {
        cursor: default;
    }

    .feedback {
        margin-top: 20px;
        padding: 15px;
        border-radius: 12px;
        text-align: center;
        font-size: 20px;
        font-weight: bold;
        display: none;
    }

    .feedback.correct-feedback {
        display: block;
        background: #dcfce7;
        color: #166534;
    }

    .feedback.wrong-feedback {
        display: block;
        background: #fee2e2;
        color: #991b1b;
    }

    .navigation {
        display: flex;
        justify-content: space-between;
        gap: 15px;
        margin-top: 20px;
    }

    .nav-btn {
        flex: 1;
        padding: 15px;
        border: none;
        border-radius: 12px;
        font-size: 17px;
        font-weight: bold;
        cursor: pointer;
    }

    .back-btn {
        background: #64748b;
        color: white;
    }

    .next-btn {
        background: #2563eb;
        color: white;
    }

    .finish-btn {
        background: #16a34a;
        color: white;
    }

    .nav-btn:disabled {
        opacity: 0.45;
        cursor: not-allowed;
    }

    .result {
        display: none;
        background: white;
        margin-top: 20px;
        padding: 35px;
        border-radius: 20px;
        text-align: center;
        box-shadow: 0 8px 25px rgba(0,0,0,0.12);
    }

    .result h2 {
        color: #2563eb;
        font-size: 30px;
    }

    .score {
        font-size: 50px;
        font-weight: bold;
        color: #16a34a;
        margin: 15px;
    }

    .emoji {
        font-size: 55px;
        margin: 10px;
    }

    .restart-btn {
        padding: 15px 30px;
        border: none;
        background: #7c3aed;
        color: white;
        border-radius: 12px;
        font-size: 17px;
        cursor: pointer;
    }

    @media (max-width: 600px) {
        .variant-buttons {
            grid-template-columns: repeat(2, 1fr);
        }

        .question {
            font-size: 18px;
        }

        .answer {
            font-size: 15px;
        }
    }
</style>
</head>

        <p>Әр нұсқада 10 сұрақ бар.</p>

        <button class="variant-btn random-btn" onclick="randomVariant()">
            🎲 Кездейсоқ нұсқа
        </button>
    </div>

    <!-- Тест -->
    <div class="test" id="test">

        <div class="progress-box">
            <div class="progress-text">
                <span id="variantTitle">1-нұсқа</span>

        </div>

        <div class="question-card">

            <div class="question" id="questionText"></div>

            <div class="answers" id="answers"></div>

            <div class="feedback" id="feedback"></div>

            <div class="navigation">
                <button class="nav-btn back-btn"
                        id="backBtn"
                        onclick="previousQuestion()">
                    ⬅ Артқа
                </button>

                <button class="nav-btn next-btn"
                        id="nextBtn"
                        onclick="nextQuestion()">
                    Алға ➡
                </button>

        </div>
    </div>

    <!-- Нәтиже -->

        <p id="resultVariant"></p>

        <div class="score" id="scoreText"></div>

        <p id="resultMessage"></p>

</div>

/* =========================================================
   ТЕСТТІ БАСҚАРУ
   ========================================================= */

let currentVariant = 0;
let currentQuestion = 0;
let userAnswers = [];
let answered = [];


/* Нұсқаны бастау */
function startTest(variant) {

    currentVariant = variant;
    currentQuestion = 0;

    userAnswers = new Array(10).fill(null);
    answered = new Array(10).fill(false);

    document.getElementById("selection").style.display = "none";
    document.getElementById("result").style.display = "none";
    document.getElementById("test").style.display = "block";

    showQuestion();
}


/* Кездейсоқ нұсқа */
function randomVariant() {

    let random = Math.floor(Math.random() * 6);

    startTest(random);
}


/* Сұрақты көрсету */
function showQuestion() {

    const test = tests[currentVariant];
    const question = test[currentQuestion];

    document.getElementById("variantTitle").textContent =
        (currentVariant + 1) + "-нұсқа";

    document.getElementById("questionCounter").textContent =
        (currentQuestion + 1) + " / " + test.length;

    document.getElementById("questionNumber").textContent =
        (currentQuestion + 1) + "-сұрақ";

    document.getElementById("questionText").textContent =
        question.q;

    const answersBox = document.getElementById("answers");
    answersBox.innerHTML = "";

    question.a.forEach((answer, index) => {

        const button = document.createElement("div");

        button.className = "answer";
        button.textContent =
            String.fromCharCode(65 + index) + ") " + answer;

        button.onclick = function() {
            selectAnswer(index);
        };

        answersBox.appendChild(button);
    });


    /* Бұрын таңдалған жауапты көрсету */
    if (userAnswers[currentQuestion] !== null) {

        const selected = userAnswers[currentQuestion];

        const answerElements =
            document.querySelectorAll(".answer");

        answerElements[selected].classList.add("selected");

        if (answered[currentQuestion]) {

            answerElements.forEach((el, index) => {

                el.classList.add("disabled");

                if (index === question.correct) {
                    el.classList.add("correct");
                }

                if (index === selected &&
                    selected !== question.correct) {
                    el.classList.add("wrong");
                }
            });

            showFeedback(selected === question.correct);
        }
    }
    else {
        hideFeedback();
    }


    /* Артқа батырмасы */
    document.getElementById("backBtn").disabled =
        currentQuestion === 0;


    /* Алға батырмасы */
    const nextBtn = document.getElementById("nextBtn");

    if (currentQuestion === test.length - 1) {
        nextBtn.textContent = "🏁 Нәтиже";
        nextBtn.className = "nav-btn finish-btn";
    }
    else {
        nextBtn.textContent = "Алға ➡";
        nextBtn.className = "nav-btn next-btn";
    }


    /* Прогресс */
    const progress =
        ((currentQuestion + 1) / test.length) * 100;

    document.getElementById("progressBar").style.width =
        progress + "%";
}


/* Жауап таңдау */
function selectAnswer(index) {

    const test = tests[currentVariant];
    const question = test[currentQuestion];

    /* Бір сұраққа қайта жауап беруге болмайды */
    if (answered[currentQuestion]) {
        return;
    }

    userAnswers[currentQuestion] = index;
    answered[currentQuestion] = true;

    const answerElements =
        document.querySelectorAll(".answer");

    answerElements.forEach((el, i) => {

        el.classList.add("disabled");

        if (i === question.correct) {
            el.classList.add("correct");
        }

        if (i === index && index !== question.correct) {
            el.classList.add("wrong");
        }

        if (i === index) {
            el.classList.add("selected");
        }
    });


    if (index === question.correct) {
        showFeedback(true);
    }
    else {
        showFeedback(false);
    }
}


/* Кері байланыс */
function showFeedback(correct) {

    const feedback =
        document.getElementById("feedback");

    feedback.style.display = "block";

    if (correct) {

        feedback.className =
            "feedback correct-feedback";

        feedback.innerHTML =
            "😊🎉 Дұрыс жауап! Жарайсың!";
    }
    else {

        feedback.className =
            "feedback wrong-feedback";

        feedback.innerHTML =
            "😔❌ Қате жауап! Дұрыс жауапты жасыл түспен көре аласыз.";
    }
}


/* Кері байланысты жасыру */
function hideFeedback() {

    const feedback =
        document.getElementById("feedback");

    feedback.style.display = "none";
    feedback.className = "feedback";
}


/* Келесі сұрақ */
function nextQuestion() {

    if (currentQuestion < tests[currentVariant].length - 1) {

        currentQuestion++;
        showQuestion();

    }
    else {

        finishTest();

    }
}


/* Алдыңғы сұрақ */
function previousQuestion() {

    if (currentQuestion > 0) {

        currentQuestion--;
        showQuestion();

    }
}


/* Тестті аяқтау */
function finishTest() {

    let score = 0;

    const test = tests[currentVariant];

    for (let i = 0; i < test.length; i++) {

        if (userAnswers[i] === test[i].correct) {
            score++;
        }
    }


    const percent =
        Math.round((score / test.length) * 100);

    document.getElementById("test").style.display =
        "none";

    document.getElementById("result").style.display =
        "block";

    document.getElementById("resultVariant").textContent =
        "Сіз " + (currentVariant + 1) +
        "-нұсқаны орындадыңыз.";

    document.getElementById("scoreText").textContent =
        score + " / " + test.length +
        " (" + percent + "%)";


    let emoji;
    let message;

    if (percent >= 90) {

        emoji = "🏆🎉😊";

        message =
            "Өте жақсы! Сен информатика тақырыптарын тамаша меңгергенсің!";

    }
    else if (percent >= 70) {

        emoji = "👏😊";

        message =
            "Жақсы нәтиже! Бірнеше тақырыпты тағы қайталап көр.";

    }
    else if (percent >= 50) {

        emoji = "🙂📚";

        message =
            "Жаман емес! Білімді бекіту үшін тақырыптарды қайталаған дұрыс.";

    }
    else {

        emoji = "😔📖";

        message =
            "Тақырыптарды қайта қарап, тестті тағы бір рет орындап көр.";

    }


    document.getElementById("resultEmoji").textContent =
        emoji;

    document.getElementById("resultMessage").textContent =
        message;
}


/* Қайта бастау */
function restartTest() {

    document.getElementById("result").style.display =
        "none";

    document.getElementById("selection").style.display =
        "block";

    document.getElementById("test").style.display =
        "none";
}
